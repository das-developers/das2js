<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>das2js inspector</title>
<style>
	body { font-family: sans-serif; margin: 1em 2em; }
	input[type=text] { width: 40em; }
	#status { color: #555; margin: 0.5em 0; }
	#out { background: #f4f4f4; padding: 1em; overflow: auto; max-height: 75vh; }
	.err { color: #a00; }
</style>
</head>
<body>
<h1>das2js inspector</h1>
<p>Point at a das stream and see its structure: every dataset, dimension and
variable with its properties, but no data values.</p>
<form id="form">
	<input type="text" id="url" placeholder="stream URL">
	<button type="submit">Load</button>
</form>
<p id="status"></p>
<pre id="out"></pre>
<script type="module" src="./Inspect.mjs"></script>
</body>
</html>
