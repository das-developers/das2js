<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>das2js performance</title>
<link rel="stylesheet" href="style.css">
<style>
	input[type=text] { width: min(44em, 100%); }
	input[type=number] { width: 4.5em; }
	#status { margin: 0.5em 0; }
	td:first-child, th:first-child { text-align: left; }
	#datasets { font-size: 90%; }
	.err { white-space: pre-wrap; }
	/* Twelve columns: scroll sideways rather than squeeze on a phone */
	.scroll { overflow-x: auto; }
</style>
</head>
<body>
<nav class="bar"><div><a href="index.html">&larr; das2js test pages</a></div></nav>
<main>
<h1>Performance</h1>
<p>Fetch a real stream, then re-parse the same bytes from memory to separate
the parser from the network.  Times are wall-clock milliseconds.</p>
<form id="form">
	<input type="text" id="url" placeholder="stream URL">
	re-parse <input type="number" id="reps" value="3" min="0" max="20"> times
	<button type="submit">Run</button>
</form>
<p id="status"></p>
<p id="datasets"></p>
<div class="scroll">
<table id="results">
	<thead><tr>
		<th>run</th><th>bytes</th><th>chunks</th><th>wall ms</th>
		<th>first header ms</th><th>first record ms</th>
		<th>parse ms</th><th>MB/s</th><th>records</th><th>records/s</th>
		<th>view all vars ms</th><th>heap MB</th>
	</tr></thead>
	<tbody></tbody>
</table>
</div>
<pre id="err" class="err"></pre>
</main>
<script type="module" src="./Perf.mjs"></script>
</body>
</html>
